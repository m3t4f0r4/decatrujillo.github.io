<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso / Registro — DeCA Trujillo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg">DT</div>
                <div>
                    <h1 class="text-base font-semibold tracking-tight text-white">DeCA Trujillo</h1>
                    <p class="text-xs text-slate-400">Portal de Autenticación</p>
                </div>
            </a>
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">&larr; Volver al inicio</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-slate-800/60 backdrop-blur-xl border border-slate-700/60 rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-6">
                <h2 id="auth-title" class="text-xl font-bold text-white">Iniciar Sesión</h2>
                <p id="auth-subtitle" class="text-xs text-slate-400 mt-1">Accede a tu panel para emitir y consultar tus DeCA</p>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Correo Electrónico</label>
                    <input type="email" id="auth-email" placeholder="usuario@empresa.com" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Contraseña</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition">
                    Entrar al Sistema
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                <span id="auth-toggle-msg">¿No tienes cuenta?</span>
                <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-indigo-400 hover:underline font-semibold ml-1">Regístrate gratis</button>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-800">
        <p>DeCA Trujillo &bull; Sistema Seguro de Autenticación</p>
    </footer>

    <script>
        let isRegisterMode = false;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('register') === 'true') {
                toggleAuthMode();
            }
            if (localStorage.getItem('deca_active_user')) {
                window.location.href = 'dashboard.html';
            }
        });

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión';
            document.getElementById('auth-subtitle').innerText = isRegisterMode ? 'Regístrate para guardar y custodiar tus DeCA' : 'Accede a tu panel para emitir y consultar tus DeCA';
            document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Registrar Cuenta' : 'Entrar al Sistema';
            document.getElementById('auth-toggle-msg').innerText = isRegisterMode ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?';
            document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? 'Inicia sesión' : 'Regístrate gratis';
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value;
            const users = JSON.parse(localStorage.getItem('deca_registered_users') || '{}');

            if (isRegisterMode) {
                if (users[email]) {
                    alert('Este usuario ya está registrado. Por favor, inicia sesión.');
                    return;
                }
                users[email] = password;
                localStorage.setItem('deca_registered_users', JSON.stringify(users));
                alert('¡Cuenta creada con éxito! Iniciando sesión...');
            } else {
                if (!users[email] || users[email] !== password) {
                    alert('Credenciales incorrectas. Verifique su correo o regístrese.');
                    return;
                }
            }

            localStorage.setItem('deca_active_user', email);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
